        function handleImageDrop(e) {
            e.preventDefault(); e.stopPropagation();
            const el = document.getElementById('dropzoneEmpty');
            if (el) el.classList.remove('border-rose-500', 'bg-rose-50/60');
            if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                processImageFiles(e.dataTransfer.files);
            }
        }

        function handleImageUpload(e) {

        function processImageFiles(files) {
            const loadingIndicator = document.getElementById('dropzoneLoadingIndicator');
            if (loadingIndicator) loadingIndicator.classList.remove('hidden');

            let processedCount = 0;
            const totalFiles = files.length;

            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) {
                    processedCount++;
                    if(processedCount === totalFiles && loadingIndicator) loadingIndicator.classList.add('hidden');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_DIMENSION = 1080;
                        if (width > height && width > MAX_DIMENSION) {
                            height = Math.round((height * MAX_DIMENSION) / width);
                            width = MAX_DIMENSION;
                        } else if (height > MAX_DIMENSION) {
                            width = Math.round((width * MAX_DIMENSION) / height);
                            height = MAX_DIMENSION;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85); 
                        referenceImages.push({
                            base64: compressedDataUrl.split(',')[1],
                            mimeType: 'image/jpeg',
                            name: file.name,
                            src: compressedDataUrl,
                            instruction: ''
                        });

                        processedCount++;
                        if (processedCount === totalFiles) {
                            renderReferenceImages();
                            if (loadingIndicator) loadingIndicator.classList.add('hidden');
                            showToast(`${totalFiles} Foto referensi dimuat!`);
                        }
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

                            </div>

                </div>`;
                
                previewContainer.innerHTML = html;
            } else {

            }
        }

        function injectStartFrameMandate(partNum) {
            const textarea = document.getElementById(`partTextarea${partNum}`);
            if (!textarea) return;

            const mandateText = `\n[MANDAT KLONING START-FRAME MUTLAK]: Gambar referensi yang dilampirkan BUKAN sekadar inspirasi, melainkan CETAK BIRU MUTLAK untuk frame pertama video. Anda WAJIB melakukan "Pixel-Perfect Match" pada detik 00:00.0. Kunci seluruh topologi spasial, skala objek, warna, komposisi letak perabot, dan sudut lensa (angle) agar 100% identik dengan foto referensi. ATURAN KINETIK AWAL: Tahan wujud visual ini secara statis (Absolute Freeze-Frame) selama 0.5 detik pertama. DILARANG KERAS ada pergerakan kamera, pergerakan partikel, atau kemunculan tangan talent sebelum detik 00:00.5. DILARANG KERAS menggeser letak benda, memutar sudut pandang, atau menghalusinasi objek yang tidak ada di foto asli pada frame pembuka ini.\n`;

            if (textarea.value.includes('[MANDAT KLONING START-FRAME MUTLAK]')) {
                showToast("Mandat Start-Frame sudah disuntikkan sebelumnya!", true);
                return;
            }

            const marker = "SCENE PROMPT KESELURUHAN (MASTER SCENE):";
            if (textarea.value.includes(marker)) {
                textarea.value = textarea.value.replace(marker, marker + mandateText);
                showToast(`Mandat Start-Frame berhasil disuntikkan ke Part ${partNum}!`);
                
                const btn = document.getElementById(`btnInjectMandate${partNum}`);
                if (btn) {
                    btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700', 'text-white');
                    btn.classList.add('bg-emerald-100', 'border', 'border-emerald-300', 'text-emerald-700', 'hover:bg-emerald-200');
                    btn.innerHTML = '<i class="fa-solid fa-check-double"></i> Mandat Disuntikkan';
                }
            } else {
                showToast("Gagal menemukan titik injeksi pada teks.", true);

        async function generateSpicePreview() {

                return;
            }

            const dishName = document.getElementById('inputDishName')?.value.trim();
            const chatInput = document.getElementById('inputSpiceChat')?.value.trim();
            
            if (!dishName && !chatInput) {
                showToast("Isi Nama Masakan atau instruksi bumbu terlebih dahulu!", true);
                return;
            }

            const btn = document.getElementById('btnPreviewSpice');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Meracik...';
            btn.disabled = true;

            try {
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                let promptText = `Buatkan daftar komposisi bumbu utuh dan bumbu halus yang paling autentik dan lengkap untuk masakan: ${dishName || 'tersebut'}. `;
                if (chatInput) {
                    promptText += `\nInstruksi tambahan mutlak dari Chef: "${chatInput}".`;
                }
                promptText += `\n\nATURAN MUTLAK:\n1. Jangan berikan cara memasaknya, HANYA daftar bumbu dan bahan utama.\n2. Pisahkan kategori dengan jelas (misal: Bumbu Halus, Bumbu Utuh/Aromatik, Bahan Utama).\n3. JANGAN gunakan bumbu generik, buat se-autentik mungkin.\n4. Langsung berikan daftarnya tanpa basa-basi pembuka atau penutup.`;

                const payload = {
                    contents: [{ role: 'user', parts: [{ text: promptText }] }],
                    generationConfig: { temperature: 0.3 }
                };

                const response = await fetchWithRetry(apiUrl, payload, 2);
                const data = await response.json();

                if (!response.ok || data.error) throw new Error(data.error?.message || "Gagal menghubungi Gemini");

                const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                
                if (resultText) {
                    document.getElementById('inputRecipeDetails').value = resultText.trim();
                    showToast("Preview bumbu berhasil dimuat! Silakan edit jika perlu.");

            } catch (err) {

            } finally {

        async function fetchWithRetry(url, payload, maxRetries = 3) {
            let delay = 1000;
            const headers = { 'Content-Type': 'application/json' };
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const res = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
                    if (res.ok) return res;
                    const clone = res.clone();
                    const data = await clone.json().catch(()=>({}));
                    const msg = data.error?.message || "";
                    if (res.status === 429) {
                        if(msg.toLowerCase().includes('quota')) return res;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2;
                        continue;
                    }
                    return res;
                } catch (e) {
                    if (i === maxRetries - 1) throw e;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
            return fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
        }

        }

        function exportToJsonFile() {
            // Mengambil data rahasia terakhir yang disimpan aplikasi saat Anda selesai generate
            const rawData = localStorage.getItem('ugc_last_result');
            if (!rawData) {
                showToast("Belum ada data prompt! Generate dulu baru bisa di-export.", true);
                return;
            }

            const dishName = document.getElementById('inputDishName')?.value || "naskah_ugc";
            const blob = new Blob([rawData], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            // Perintah otomatis mendownload file ke komputer Anda
            const a = document.createElement('a');
            a.href = url;
            a.download = `${dishName.replace(/\s+/g, '_').toUpperCase()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            showToast("Berhasil! File JSON tersimpan di komputer.");
        }

        // 2. MESIN UNTUK MEMBUKA KEMBALI (LOAD/IMPORT)
        function importFromJsonFile(event) {
            const file = event.target.files ? event.target.files[0] : null;
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const jsonContent = e.target.result;
                    const parsedData = JSON.parse(jsonContent);

                    // Pengecekan apakah file yang dimasukkan benar
                    if (!parsedData.parts || !parsedData.dishName) {
                        throw new Error("Format file salah. Ini bukan file Blueprint yang valid.");
                    }

                    // Memasukkan kembali data ke memori aplikasi
                    localStorage.setItem('ugc_last_result', jsonContent);

                    // Memunculkan nama masakan ke kolom input
                    const dishInput = document.getElementById('inputDishName');
                    if (dishInput) dishInput.value = parsedData.dishName;

                    // Membangun ulang tampilan kartu prompt di layar secara otomatis
                    const envSelected = document.getElementById('environmentSelect')?.value || "Indoor";
                    const overlayStyle = document.getElementById('overlayStyleSelect')?.value || "Doodle Text";
                    const voiceStyle = document.getElementById('voiceStyleSelect')?.value || "Casual";
                    const handProfile = { name: "Talent Standar" };

                    renderPromptDataToUI(parsedData, parsedData.dishName, envSelected, overlayStyle, voiceStyle, handProfile);

                    showToast(`Keren! Naskah untuk "${parsedData.dishName}" berhasil dimuat ulang.`);
                } catch (err) {
                    showToast(`Gagal membaca file: ${err.message}`, true);
                } finally {
                    event.target.value = ''; // Reset pilihan file
                }
            };
            reader.readAsText(file);
        }

        function escapeHtml(string) {
            const entityMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '/': '&#x2F;' };
            return String(string).replace(/[&<>"'/]/g, s => entityMap[s]);
        }

        function handlePartImageUpload(e, partNum) {
            const file = e.target.files ? e.target.files[0] : null;
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast("Format file tidak didukung.", true);
                return;
            }

            const previewContainer = document.getElementById(`partImagePreviewContainer${partNum}`);
            const loadingIcon = document.getElementById(`partImageLoading${partNum}`);
            const previewImg = document.getElementById(`partImagePreviewImg${partNum}`);
            const previewName = document.getElementById(`partImagePreviewName${partNum}`);
            
            if (previewContainer) {
                previewContainer.classList.remove('hidden');
                previewContainer.classList.add('flex');
                if (loadingIcon) loadingIcon.classList.remove('hidden');
                if (previewImg) previewImg.classList.add('hidden');
            }

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_DIMENSION = 800; 
                    if (width > height && width > MAX_DIMENSION) {
                        height = Math.round((height * MAX_DIMENSION) / width);
                        width = MAX_DIMENSION;
                    } else if (height > MAX_DIMENSION) {
                        width = Math.round((width * MAX_DIMENSION) / height);
                        height = MAX_DIMENSION;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const base64Url = canvas.toDataURL('image/jpeg', 0.85);
                    const base64Data = base64Url.split(',')[1];
                    
                    partTempImages[partNum] = { base64: base64Data, mimeType: 'image/jpeg', name: file.name };

                    if (previewImg && previewName && loadingIcon) {
                        previewImg.src = base64Url;
                        previewName.textContent = file.name;
                        loadingIcon.classList.add('hidden');
                        previewImg.classList.remove('hidden');
                    }
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

    <div id="toastNotification" class="hidden fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl border border-slate-800 flex items-center gap-3 text-xs max-w-sm transition-all">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span id="toastMessage" class="flex-1 font-medium leading-snug">Operasi berhasil.</span>
    </div>
<script>
    // Memblokir Klik Kanan
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Memblokir Tombol F12, Ctrl+U (View Source), Ctrl+Shift+I (Inspect)
    document.onkeydown = function(e) {
        if (e.keyCode == 123) { // F12
            return false;
        }
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { // Ctrl+Shift+I
            return false;
        }
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { // Ctrl+Shift+C
            return false;
        }
        if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { // Ctrl+Shift+J
            return false;
        }
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { // Ctrl+U
            return false;
        }
    };
</script>
</body>
</html>
